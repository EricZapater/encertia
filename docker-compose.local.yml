name: encertia-local

services:
  db:
    image: postgres:16-alpine
    container_name: encertia-local-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-encertia}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - local-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: encertia-local-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-encertia}
      DB_SSLMODE: disable
      PORT: 8080
      GIN_MODE: debug
      AUTO_MIGRATE: "true"
      JWT_SECRET: ${JWT_SECRET:-encertia-local-dev-jwt-secret-min-32-chars-long}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - local-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: encertia-local-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - local-net

networks:
  local-net:
    driver: bridge

volumes:
  postgres_local_data:
    driver: local
