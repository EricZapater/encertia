name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend (Go) Tests & Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify Go dependencies
        run: |
          go mod verify
          go mod tidy --diff || true

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Go Tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Verify Binary Compilation
        run: CGO_ENABLED=0 go build -v -o /dev/null ./cmd/api/main.go

  frontend-ci:
    name: Frontend (Vue 3 / TypeScript) Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Run TypeScript type-check
        run: pnpm run type-check

      - name: Run Frontend Build
        run: pnpm run build

  docker-lint-ci:
    name: Dockerfile & Compose Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet
