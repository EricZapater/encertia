openapi: 3.0.3
info:
  title: Encertia — Auth API
  version: 0.2.0
  description: >
    Contracte del mòdul d'autenticació. Autenticació basada en par de tokens JWT
    (Access Token d'accés ràpid + Refresh Token de llarga durada guardat a Postgres),
    amb taula de revocació a la BD per a invalidació real al logout.

servers:
  - url: /api/v1

paths:
  /auth/register:
    post:
      operationId: register
      summary: Registra un nou usuari (rol student per defecte)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuari creat i autenticat amb èxit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Dades de registre invàlides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: El correu electrònic ja està registrat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      operationId: login
      summary: Autentica un usuari (admin, teacher o student) i retorna el par de tokens JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login correcte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credencials invàlides (email o contrasenya incorrectes) o compte desactivat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Renova el par de tokens JWT utilitzant un Refresh Token vàlid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens renovats correctament
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Refresh Token invàlid, expirat o revocat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      operationId: logout
      summary: Revoca la sessió actual al servidor (invalidació del Refresh Token i de l'Access Token actiu)
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Sessió revocada correctament al servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Token absent, invàlid, caducat o revocat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Retorna l'usuari autenticat a partir de l'Access Token actual
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuari actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Token absent, invàlid o expirat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access Token JWT enviat com a "Authorization: Bearer <token>".
        Validat per la signatura HMAC i verificat contra la taula de revocació de sessions.

  schemas:
    UserRole:
      type: string
      enum: [admin, teacher, student]
      description: Rol de l'usuari a la plataforma Encertia.

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        language:
          type: string
          enum: [ca, es, en]
          default: ca
          description: Idioma de preferència de l'usuari (ca, es, en).
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, email, firstName, lastName, role, language, isActive, createdAt]

    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT Access Token (vàlid 15 minuts)
        refreshToken:
          type: string
          description: Refresh Token aleatori (vàlid 7 dies)
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: Temps de vida de l'Access Token en segons (900s)
      required: [accessToken, refreshToken, tokenType, expiresIn]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          $ref: '#/components/schemas/TokenPair'
      required: [user, tokens]

    UserResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
      required: [user]

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        language:
          type: string
          enum: [ca, es, en]
          default: ca
      required: [email, password, firstName, lastName]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required: [email, password]

    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required: [refreshToken]

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string

    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: Sessió tancada correctament.
      required: [message]

    ErrorDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      required: [code, message]

    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required: [error]
