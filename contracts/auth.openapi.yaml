openapi: 3.0.3
info:
  title: Encertia - Auth API
  description: Contracte d'API per al mòdul d'autenticació i gestió d'identitat d'Encertia.
  version: 0.1.0
paths:
  /auth/register:
    post:
      summary: Registre públic d'un nou usuari (només student)
      description: Crea un nou compte d'usuari amb rol `student` i retorna els tokens d'accés inicials. La creació de rols `teacher` o `admin` es fa exclusivament des de l'aplicació per un administrador.
      operationId: register
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuari registrat correctament.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Dades invàlides o contrasenya massa feble.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: El correu electrònic ja està registrat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error intern del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      summary: Inici de sessió
      description: Autentica un usuari amb email i contrasenya, retornant el parell de tokens JWT.
      operationId: login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticació satisfactòria.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Format de dades invàlid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Credencials incorrectes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error intern del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      summary: Renovació del token d'accés
      description: Obté un nou accessToken i refreshToken a partir d'un refreshToken vigent.
      operationId: refreshToken
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens renovats correctament.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: Petició invàlida o manca de token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Refresh token expirat o revocat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error intern del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      summary: Tancament de sessió
      description: Invalida el refresh token actiu de l'usuari.
      operationId: logout
      tags:
        - Auth
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Sessió tancada correctament.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: No autoritzat o token invàlid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error intern del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      summary: Obtenir dades de l'usuari autenticat
      description: Retorna les dades del perfil de l'usuari associat al token d'accés actual.
      operationId: getCurrentUser
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Perfil recuperat correctament.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Token no vàlid o expirat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuari no trobat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error intern del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserRole:
      type: string
      enum:
        - admin
        - teacher
        - student
      description: Rol de l'usuari dins de la plataforma.

    User:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
        - role
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        email:
          type: string
          format: email
          example: "professor@encertia.cat"
        firstName:
          type: string
          example: "Maria"
        lastName:
          type: string
          example: "Garcia"
        role:
          $ref: '#/components/schemas/UserRole'
        createdAt:
          type: string
          format: date-time
          example: "2026-08-21T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-08-21T10:00:00Z"

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - firstName
        - lastName
      properties:
        email:
          type: string
          format: email
          example: "maria.garcia@encertia.cat"
        password:
          type: string
          format: password
          minLength: 8
          example: "SecretPassword123!"
        firstName:
          type: string
          minLength: 1
          example: "Maria"
        lastName:
          type: string
          minLength: 1
          example: "Garcia"
        role:
          $ref: '#/components/schemas/UserRole'
          default: student
          description: Opcional en registre públic; per defecte sempre s'assigna `student`.

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "maria.garcia@encertia.cat"
        password:
          type: string
          format: password
          example: "SecretPassword123!"

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          example: "dGhpcy1pcy1hLXJlZnJlc2gtdG9rZW4..."

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Opcional si es vol revocar un refresh token específic a més del context de sessió.
          example: "dGhpcy1pcy1hLXJlZnJlc2gtdG9rZW4..."

    TokenPair:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
          description: Token JWT d'accés (curta durada).
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          description: Token de renovació (llarga durada).
          example: "dGhpcy1pcy1hLXJlZnJlc2gtdG9rZW4..."
        tokenType:
          type: string
          example: "Bearer"
        expiresIn:
          type: integer
          description: Segons de validesa del token d'accés (ex. 900 per 15 minuts).
          example: 900

    AuthResponse:
      type: object
      required:
        - user
        - tokens
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          $ref: '#/components/schemas/TokenPair'

    UserResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/User'

    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Sessió tancada correctament."

    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "INVALID_CREDENTIALS"
        message:
          type: string
          example: "El correu o la contrasenya són incorrectes."
        details:
          type: object
          additionalProperties: true
          description: Informació addicional de validació per camp, si escau.

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
